{% extends "base.html" %}
{% block title %}Topic mind map · Rozvedka{% endblock %}
{% block head %}<script src="/static/vendor/echarts/echarts.min.js"></script>{% endblock %}
{% block main %}
<nav class="subnav" aria-label="Topic views"><a href="/topics">List</a><a href="/topics/map" class="on">Mind map</a></nav>
<form class="filters trend-filters" id="scope" onsubmit="return false">
  <select name="coalition" aria-label="Reporting coalition"><option value="">Reports from all countries</option>
    {% for key, c in COALITIONS.items() %}<option value="{{ key }}">Reports from {{ c.name }}</option>{% endfor %}
  </select>
  <label class="chk">from <select name="year_from"><option value="">all</option>{% for y in years|reverse %}<option>{{ y }}</option>{% endfor %}</select></label>
  <label class="chk">to <select name="year_to"><option value="">all</option>{% for y in years %}<option>{{ y }}</option>{% endfor %}</select></label>
  <label class="chk">actors per topic <select name="per_topic">{% for n in [0, 3, 6, 10] %}<option {{ 'selected' if n == 6 }}>{{ n }}</option>{% endfor %}</select></label>
</form>
<section class="viz-card">
  <p id="sub" class="muted small viz-sub"></p>
  <div class="tree-grid">
    <div id="tree" class="chart chart-tree" role="img" aria-describedby="sub"></div>
    <aside id="panel" class="tree-panel" aria-live="polite"><p class="muted small">Click a category or a topic to unfold
      it; the details and the links to the reports appear here. Scroll to zoom, drag to move.</p></aside>
  </div>
  <details class="viz-table"><summary>Table view</summary><div id="table"></div></details>
</section>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const form = $("#scope");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const url = new URL(location);
  for (const el of form.elements) { const v = url.searchParams.get(el.name); if (v != null) el.value = v; }
  const chart = echarts.init($("#tree"), null, { renderer: "canvas" });
  let data = null;
  chart.on("click", (p) => { if (p.data) panel(p.data); });
  function panel(n) {
    const box = $("#panel");
    if (n.type === "category") {
      box.innerHTML = `<h3>${esc(n.name)}</h3><p class="small">${n.children.length} topics. Click a topic to see its actors.</p>
        <ul class="plain small">${n.children.map((t) => `<li><a href="${esc(t.link)}">${esc(t.raw)}</a> <span class="muted">${t.value}</span></li>`).join("")}</ul>`;
    } else if (n.type === "topic") {
      box.innerHTML = `<h3>${esc(n.raw)}</h3><p class="small"><a href="${esc(n.link)}">${n.value} reports</a> in scope.</p>
        ${n.children.length ? `<p class="small muted">Actors most specific to this topic – share of the actor's reports that carry it:</p>
        <ul class="plain small">${n.children.map((a) => `<li><a href="${esc(a.actor)}">${esc(a.raw)}</a> –
          <a href="${esc(a.link)}">${a.value}</a> of <a href="${esc(a.all_link)}">${a.of}</a> reports (${Math.round(a.share * 100)}%)</li>`).join("")}</ul>`
        : '<p class="small muted">No actor with enough reports on this topic.</p>'}`;
    } else if (n.type === "actor") {
      box.innerHTML = `<h3>${esc(n.raw)}</h3><p class="small"><a href="${esc(n.link)}">${n.value}</a> of its
        <a href="${esc(n.all_link)}">${n.of}</a> reports carry this topic (${Math.round(n.share * 100)}%).</p>
        <p class="small"><a href="${esc(n.actor)}">Actor page →</a></p>`;
    }
  }
  addEventListener("resize", () => chart.resize());
  dark.addEventListener("change", () => data && draw());
  function draw() {
    const topicsShown = data.tree.children.reduce((n, c) => n + c.children.length, 0);
    $("#tree").style.height = Math.max(600, topicsShown * 17 + 40) + "px";
    chart.resize();
    const ink = css("--ink"), muted = css("--muted"), line = css("--line"), panel = css("--panel");
    const blue = dark.matches ? "#3987e5" : "#2a78d6", orange = dark.matches ? "#d95926" : "#eb6834";
    const maxT = Math.max(1, ...data.tree.children.flatMap((c) => c.children.map((t) => t.value)));
    const style = (n) => {
      if (n.type === "category") return { ...n, raw: n.name, symbolSize: 12, itemStyle: { color: ink, borderColor: panel },
        label: { fontWeight: 700, fontSize: 12, color: ink }, children: n.children.map(style) };
      if (n.type === "topic") return { ...n, raw: n.name, name: `${n.name} (${n.value})`, symbolSize: 5 + 14 * Math.sqrt(n.value / maxT),
        itemStyle: { color: blue, borderColor: panel }, children: n.children.map(style) };
      return { ...n, raw: n.name, name: `${n.name} (${n.value}/${n.of})`, symbolSize: 6, itemStyle: { color: orange, borderColor: panel },
        label: { color: ink, fontSize: 10 } };
    };
    chart.setOption({
      tooltip: { backgroundColor: panel, borderColor: line, textStyle: { color: ink, fontSize: 12 },
        formatter: (p) => p.data.type === "category" ? `<b>${esc(p.data.name)}</b>` :
          p.data.type === "topic" ? `<b>${esc(p.data.name)}</b><br>reports · click to unfold its actors` :
          `<b>${esc(p.data.raw)}</b><br>${p.data.value} of its ${p.data.of} reports are on this topic` },
      series: [{ type: "tree", layout: "orthogonal", orient: "LR", roam: true, top: 10, bottom: 10, left: 20, right: 380,
        data: [{ ...style({ ...data.tree, type: "category" }), label: { show: false }, symbolSize: 6 }],
        leaves: { label: { position: "right", verticalAlign: "middle", align: "left" } },
        symbol: "circle", initialTreeDepth: 2, expandAndCollapse: true, animationDuration: 300,
        lineStyle: { color: line, width: 1, curveness: 0.5 },
        label: { color: ink, fontSize: 11, position: "right", verticalAlign: "middle", align: "left" } }],
    }, true);
    $("#sub").textContent = data.how;
    $("#table").innerHTML = '<table class="vt"><tr><th>Category</th><th>Topic</th><th>Reports</th><th>Actors named in most of them</th></tr>' +
      data.tree.children.flatMap((c) => c.children.map((t) => `<tr><td>${esc(c.name)}</td><td>${esc(t.name)}</td>
        <td><a href="${esc(t.link)}">${t.value}</a></td><td>${t.children.map((a) => `<a href="${esc(a.actor)}">${esc(a.name)}</a> <a class="muted" href="${esc(a.link)}">${a.value}/${a.of}</a>`).join(", ")}</td></tr>`)).join("") + "</table>";
  }
  async function load() {
    const q = new URLSearchParams();
    for (const el of form.elements) if (el.name && el.value !== "") q.set(el.name, el.value);
    const page = new URL(location); page.search = q.toString(); history.replaceState(null, "", page);
    data = await (await fetch(`/api/topics/tree?${q}`)).json();
    draw();
  }
  form.addEventListener("change", load);
  load();
})();
</script>
{% endblock %}
