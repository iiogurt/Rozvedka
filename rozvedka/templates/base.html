<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rozvedka{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="top">
  <a class="brand" href="/">Rozvedka</a>
  <nav>
    <a href="/" class="{{ 'on' if request.url.path == '/' }}">Documents</a>
    <a href="/sources" class="{{ 'on' if request.url.path == '/sources' }}">Sources</a>
    <a href="/topics" class="{{ 'on' if request.url.path == '/topics' }}">Topics</a>
    <a href="/map" class="{{ 'on' if request.url.path == '/map' }}">Map</a>
  </nav>
</header>
{% if jobs %}
<section class="jobs">
  {% for name, st in jobs.items() %}<div><b>{{ name }}</b> — {{ st }}</div>{% endfor %}
</section>
{% endif %}
<main>{% block main %}{% endblock %}</main>
<footer class="foot">Rozvedka <a href="/changelog" title="What's new">v{{ VERSION }}</a></footer>
</body>
</html>
