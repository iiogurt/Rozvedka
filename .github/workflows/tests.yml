# Runs the test suite on every pull request and on pushes to main. The tests build their own temporary libraries
# (no data/ directory, no network), so a plain checkout is enough.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # the Raspberry Pi target (Debian, Python 3.13) must pass; the other systems and versions are measured, not required
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.13"]
        experimental: [false]
        include:
          - {os: ubuntu-latest, python: "3.12", experimental: true}
          - {os: ubuntu-latest, python: "3.11", experimental: true}
          - {os: ubuntu-24.04-arm, python: "3.13", experimental: true}
          - {os: macos-latest, python: "3.13", experimental: true}
          - {os: windows-latest, python: "3.13", experimental: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
