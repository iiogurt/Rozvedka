# Countries and groups used by the registry: display name, region and coalition memberships.
#
# coalitions: year the country joined (for Schengen: year of full implementation).
# Status as of 2026-09-30. Sources: official member lists of NATO, the EU, the Schengen area, G7,
# AUKUS and the Joint Expeditionary Force; Five Eyes = UKUSA signals-intelligence partners.
#
# Quote "NO": a bare NO is read as boolean false by YAML.

coalitions:
  EU:        {name: "European Union", short: "EU", description: "27 member states; common foreign & security policy, mutual assistance clause (Art. 42.7 TEU)."}
  NATO:      {name: "NATO", short: "NATO", description: "North Atlantic Treaty Organization – collective defence (Article 5), 32 Allies."}
  FVEY:      {name: "Five Eyes", short: "Five Eyes", description: "Signals-intelligence alliance (UKUSA): Australia, Canada, New Zealand, United Kingdom, United States."}
  G7:        {name: "Group of Seven", short: "G7", description: "Forum of seven major advanced economies (the EU also takes part)."}
  SCHENGEN:  {name: "Schengen Area", short: "Schengen", description: "Area without internal border controls; shared Schengen Information System."}
  AUKUS:     {name: "AUKUS", short: "AUKUS", description: "Trilateral security partnership of Australia, the United Kingdom and the United States (2021)."}
  JEF:       {name: "Joint Expeditionary Force", short: "JEF", description: "UK-led defence coalition of ten Northern European nations."}
  NATO_IP4:  {name: "NATO Indo-Pacific partners", short: "NATO IP4", description: "Australia, Japan, New Zealand and South Korea – NATO's partners in the Indo-Pacific."}

regions:
  - "EU member states"
  - "EU and NATO"
  - "Other European democracies"
  - "Americas"
  - "Latin America"
  - "Asia-Pacific"
  - "International"

