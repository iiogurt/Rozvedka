# Credibility profiles of the independent publishers (think tanks) – hand-researched evidence, see
# docs/PUBLISHER_PROFILES.md. Keyed by the registry source key (country/agency).
#
# funding.disclosure – what the publisher itself publishes about who funds it (Transparify's method):
#   amounts     donors named with the amount each gave            (Transparify ★★★★★)
#   brackets    donors named in funding brackets                  (★★★★)
#   names       donors named, no amounts                          (★★★)
#   categories  only kinds of funders or shares, few or no names  (★★)
#   none        donors not disclosed                              (★ and below)
# funding.governments – donor governments named by the publisher (ISO 3166 alpha-3); a donor government rated an
#   autocracy by V-Dem (Regimes of the World) is flagged automatically from the ratings data.
# Every claim has its evidence URL and the date it was checked. Fetched automatically (`fetch-publishers`): EU
# Transparency Register entry, US FARA registration, US/UK/EU/UN sanctions lists, Wikidata/Wikipedia identity.
#
# Commercial analysts (registry publisher: commercial) – companies; instead of funding:
# ownership.disclosure – who owns the company and how openly that is known:
#   listed  listed company – its shareholders are in public filings     (✓)
#   stakes  owners named with their stakes                              (✓)
#   named   owners named, their stakes not published                    (◐)
#   none    owners not disclosed                                        (✗ concerns)
# ownership.states – states that own a stake (ISO alpha-3); an autocracy among them is a concern.
# clients.disclosure – named | some (some clients or partners named) | none (usual; does not change the rating).
# Every kind may also have:
# methods – authors: named | unnamed; methodology: URL of a published method (or null); evidence; checked.
# us_awards – the exact recipient names on USAspending.gov whose US federal contracts and grants are fetched.
# ties – owners, sponsors, founders, leaders, partners: {rel, name, kind: person | org | company | foundation | government,
#   qid (Wikidata, when it has one), country (alpha-3, for a government), amount, note, evidence, checked}. They become links
#   of the network (layer "publishers"), as do a think tank's donor governments and the owners, founders, funders and
#   leaders on the publisher's Wikidata item.

