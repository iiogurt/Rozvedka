# Credibility profiles of the independent publishers (think tanks) – hand-researched evidence, see
# docs/PUBLISHER_PROFILES.md. Keyed by the registry source key (country/agency).
#
# funding.disclosure – what the publisher itself publishes about who funds it (Transparify's method):
#   amounts     donors named with the amount each gave            (Transparify ★★★★★)
#   brackets    donors named in funding brackets                  (★★★★)
#   names       donors named, no amounts                          (★★★)
#   categories  only kinds of funders or shares, few or no names  (★★)
#   none        donors not disclosed                              (★ and below)
# funding.governments – donor governments named by the publisher (ISO 3166 alpha-3); a donor government rated an
#   autocracy by V-Dem (Regimes of the World) is flagged automatically from the ratings data.
# Every claim has its evidence URL and the date it was checked. Fetched automatically (`fetch-publishers`): EU
# Transparency Register entry, US FARA registration, US/UK/EU/UN sanctions lists, Wikidata/Wikipedia identity.

US/CEPA:
  wikipedia: "Center for European Policy Analysis"
  funding:
    disclosure: names
    evidence: "https://cepa.org/about/our-supporters/"
    checked: 2026-10-07
    note: "Supporters (individuals, corporations incl. defence and technology companies, foundations, governments) are listed without amounts; no single funder above 50 % of revenue. The page refuses automated requests; checked through search results and the EU Transparency Register."
    governments: []

US/CSIS:
  wikipedia: "Center for Strategic and International Studies"
  funding:
    disclosure: brackets
    evidence: "https://www.csis.org/about/financial-information/donors/us-and-alliedpartner-government"
    checked: 2026-10-07
    note: "Donors in four brackets ($250,000 and up … $5,000–49,999), by category; FY2025 list. Government donors: United States, Japan, Taiwan ($250,000+); Denmark, Republic of Korea, United Arab Emirates ($100,000–249,999); Germany, Norway, United Kingdom; New Zealand, NATO."
    governments: [USA, JPN, TWN, DNK, KOR, ARE, DEU, NOR, GBR, NZL]
  former_ratings:
    - {by: Transparify, year: 2016, rating: "4 stars – broadly transparent (donors grouped in brackets)", source: "https://onthinktanks.org/wp-content/uploads/2016/09/OnThinkTanks_TransparifyCharts.pdf"}

US/ISW:
  wikipedia: "Institute for the Study of War"
  funding:
    disclosure: none
    evidence: "https://responsiblestatecraft.org/think-tanks-iran-war/"
    checked: 2026-10-07
    note: "ISW states it is funded by foundations, corporations and individuals and takes no government money, but 'does not share information about our supporters or their giving histories outside standard 990 reporting' (ISW to Responsible Statecraft); former corporate supporters include defence contractors. US tax returns (Form 990) show totals only."
    governments: []

US/Freedom House:
  wikipedia: "Freedom House"
  funding:
    disclosure: categories
    evidence: "https://www.longtermwiki.com/organizations/freedom-house"
    checked: 2026-10-07
    note: "Audited financial statements and US tax returns show revenue by type: US federal grants were about 85 % of revenue (FY2022: $79.6M of $93.7M). Individual private donors are not listed with amounts. Also the source of the Freedom in the World ratings used on /ratings."
    governments: [USA]

