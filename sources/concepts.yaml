# Concepts for cross-language search – English Wikipedia article titles, grouped by topic (sources/topics.yaml).
# `python -m rozvedka fetch-concepts` resolves each title to its Wikidata item and stores the item's labels and
# aliases in the library's languages (data/gazetteer/concepts.json, with revision and retrieval date). A search word
# equal to one of those labels also finds the others ("Drohne" → drone, dron, drón …); the expansion is shown with
# its Wikidata source and can be switched off. Hand-written: add titles here; translations come only from Wikidata.

