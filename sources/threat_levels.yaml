# Terrorism threat levels of states – what the official sources say, with the passage. Hand-curated; each entry is checked:
#   kind: report        – a level an agency's report in this library states; the quote must be in the stored text of that
#                         report (checked every time against the library, no network), and the page is found from it.
#   kind: announcement  – an official announcement of a change, on a page the crawler may fetch; `fetch-threat-levels`
#                         downloads the page and confirms the quote.
# country  – ISO code of the state;  system – the name of the scale;  scale – its steps;  rank – the step (None if qualitative)
# label    – the step's name in the source;  as_of – the date of a change, or the year (month) of the report stating the level
# change   – for announcements: what it changed;  url – the report (as in the library) or the announcement page
# `quote` is verbatim (quotes and dashes compared loosely); `says` is a plain-language summary. A report stating a level only
# shows the level at that time; it is not a complete history and does not say when the level started.
