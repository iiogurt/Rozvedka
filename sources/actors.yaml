# Names that are never matched, for any actor: ordinary words and abbreviations with other common meanings.
ignore_aliases: [IS, ETA, IRA, Base, Al, ISI, MI, Mafia, Kartell, Cartel, The Company,
                 Organisation, Organization, Group, Gruppe, Service, Dienst, Agency, State, Ministry, Bureau,
                 Directorate, Department, Committee, Center, Centre, Office, Unit, Army, Navy, Police, Polizei,
                 Guard, Corps, Front, Party, Movement, Network, Brigade, Battalion, Legion,
                 # regions and places used as aliases of regional branches (review 2026-10-01)
                 East Asia, West Africa, Central Africa, Sahel, Somalia, Yemen, Khorasan, Caucasus, Sinai]

# Per actor (by Wikidata item or MITRE ATT&CK group id): names not to match, because they mean something else
# in the reports.
# Per actor: names that count in a report only when the report also uses another name of the same actor –
# for names that are also common surnames or words in other contexts.
weak_aliases: {}                    # e.g.  Q123: [Name]

# Per actor: sources (registry key country/agency) whose reports use the actor's name for something else.
exclude_sources:
  Q36597284: [OTHER/IPCC]                     # Wagner Group: "Wagner" in IPCC reports are authors' surnames

# Review of the most frequent matches, 2026-10-01: each entry was checked against sample passages.
exclude_aliases:
  Q7747: [Vladimir, Volodymyr]
  Q115923383: [Patriot]                       # Patriot (PMC): matches the Patriot air-defence system
  Q18112628: [Khorasan, Khurāsān, Chorasan]   # Khorasan group: the reports mean Islamic State Khorasan Province
  Q197581: [17. November, November 17]        # 17 November (Greece): matches dates
  Q152993: [Abwehr]                           # Abwehr (1920–1944): German word for "defence"
  Q19294807: [Equation]                       # Equation Group: matches equation numbers (IPCC reports)
  Q127784: [Mara]                             # MS-13: a place and family name in Latin American reports
  Q36597284: [Liga]                           # Wagner Group: "Liga" is a common word (league)
  Q106503397: [Machete]                       # El Machete: Spanish word
  Q5474411: [Emet]                            # Hebrew word, matches names and places
  Q100701388: [Mirage]                        # matches the Mirage fighter aircraft
  Q106492897: [Armageddon]                    # Gamaredon alias; an ordinary word
  Q244527: [Varsovia]                         # Zwi Migdal: Spanish name of Warsaw
  Q17125354: [Stewards]
  Q1778907: [Revolutionary Cells]             # Revolutionary Nuclei: the name of other groups
  Q30: [America, América, Amérique, Amerika, Ameryka, États]   # United States: "Latin America", "América Latina"
  Q884: [Korea, Corea, Corée, Korea Południowa]                # South Korea: "Korea" alone may mean either
  Q2940548: [Valencia]                        # Milenio Cartel: a city and a family name

# Countries are actors too (kind "country"), so the portal can show which countries' reports talk about which
# countries. They come from Wikidata: sovereign states (Q3624078) with an ISO code, with their labels, aliases and
# demonyms (P1549). `extra` adds territories that are not on that list (Wikidata item: ISO code).
countries:
  extra:
    Q865: TW          # Taiwan
    Q1246: XK         # Kosovo
    Q219060: PS       # State of Palestine
  aliases: {}
