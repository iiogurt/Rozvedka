# Actor index – which named actors (organisations, groups, people) are recognised in the reports.
#
# Most actors come automatically from public reference data, fetched by `python -m rozvedka fetch-actors`:
#   - Wikidata items of the classes below (with an English Wikipedia article, not dissolved before 2000)
#   - Wikidata items "designated as terrorist by" (P3461) any authority
#   - MITRE ATT&CK groups (threat actors) with their aliases; linked to Wikidata through P9025 where it exists
# Names and aliases come from Wikidata in the report languages, plus MITRE ATT&CK aliases. Each actor page says
# where every fact and every alias comes from.
#
# This file adds what those sources miss and corrects ambiguous names. Everything here is shown as
# "added by hand in sources/actors.yaml".

classes:            # Wikidata class → kind shown in the portal (instances and subclasses are included)
  Q47913: state            # intelligence agency
  Q214183: state           # secret police
  Q2801262: cyber          # hacker group
  Q4686357: cyber          # advanced persistent threat
  Q1057214: armed          # private military company
  Q207320: armed           # paramilitary organization
  Q17127659: terror        # terrorist organization
  Q4335775: crime          # organized crime group
  Q1260006: crime          # drug cartel

# Key actors in security reporting that the classes above do not reach (movements, campaigns, people).
# Give the English Wikipedia title; the Wikidata item is resolved from it. `aliases` are extra names matched
# in the text in addition to Wikidata's (e.g. surnames, which Wikidata rarely lists as aliases).
seeds:
  - {wikipedia: Vladimir Putin, kind: person, aliases: [Putin, Putins, Putina, Putinem, Putinovi, Poutine]}
