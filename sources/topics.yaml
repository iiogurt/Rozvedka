# Rozvedka topic taxonomy – which subjects a report covers.
#
# Structure: categories → topics → terms per language.
# Term syntax (matching is case- and accent-insensitive; ß=ss, ø=o, æ=ae, ł=l, đ=d):
#   word        whole word only                     e.g.  isis
#   stem*       word starting with the stem         e.g.  extremis*   → extremism, extremist, extremistische
#   two words   phrase; tokens may carry *          e.g.  "far right", "pravicov* extremis*"
#   CJK terms (Japanese/Chinese/Korean) match as plain substrings.
# All languages are applied to every document (reports mix languages; English terms appear everywhere).
#
# Assignment (rozvedka/topics.py): a topic is assigned when the title matches, or the text contains at least
# 2 different terms and enough hits for its length. Editing this file and running `index-topics` re-classifies
# every document from the stored text – nothing is downloaded again.

