# Reference events drawn as markers on the trend charts.
#
# Only `wikipedia` (English article title) and `label` are written by hand. Everything else – Wikidata item,
# date and the source links – is filled in from Wikipedia/Wikidata by `python3 tools/build_events.py`, so every
# marker can be traced back: the date is Wikidata's "point in time" (P585) or "start time" (P580) or "inception" (P571) of that item;
# events whose item has none of these are listed but not drawn.
# Do not edit the generated fields by hand; re-run the tool instead.
