# Official attributions – statements in which a government body names a cyber threat group and, where it says so, the
# state body behind it (roadmap D6). Hand-written; every entry is checked against the published page by
# `python -m rozvedka fetch-attributions`: the `quote` and every word in `names` must be on the page, else the entry
# is shown as not confirmed. Only pages the crawler may fetch are listed (the Council of the EU blocks it).
#   date      – publication date on the page (not the date of the events)
#   by        – the body that published it; country – its ISO code
#   url       – the official page; title – its title as published
#   actors    – actor keys named in the statement (groups first, then the state bodies it attributes them to)
#   quote     – a verbatim passage of the page (quotes and dashes are compared loosely); says – plain-language summary
#   names     – other names the page must contain (aliases that tie the statement to the actor)
attributions:
