     title: "Advisory: Turla group exploits Iranian APT to expand coverage of victims",
     url: https://www.ncsc.gov.uk/news/turla-group-exploits-iran-apt-to-expand-coverage-of-victims,
     quote: "The Turla group, also known as Waterbug or VENOMOUS BEAR, is suspected to be Russia-based.",
     says: "UK and US agencies describe how Turla used Iranian tools and infrastructure against its victims; the group is only 'suspected' to be Russia-based."}
