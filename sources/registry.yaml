# Rozvedka source registry — official publishers of security / resilience / preparedness reports.
#
# Per source:
#   type:   intelligence-civil | intelligence-military | cyber | civil-protection | police-ct | eu-body | nato | other
#   access: auto (plain fetch) | browser-ua (needs browser headers) | tls-lenient (server sends incomplete cert chain)
#           | browser-js (content rendered by JavaScript) | manual (bot-protected; add documents by hand in portal)
#   pages:  one entry per language version / archive page
#     lang: ISO 639-1 code; "cs+en" = one page listing reports in several languages
#     kind: current (latest edition / main list) | archive (older editions) | series (page of one report series)
#     verified: false = URL taken from official search results but could not be fetched from here (bot-protected)
#   url_pattern: predictable direct-PDF URLs the downloader can generate ({year}, {lang})
#
# Last verified: 2026-09-29

